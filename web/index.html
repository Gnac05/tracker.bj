<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trouvez près de vous les stations-service qui ont de l'essence et les pharmacies de garde au Bénin.">
  <meta name="theme-color" content="#008751">
  <meta property="og:title" content="Tracker Bénin">
  <meta property="og:description" content="Stations-service avec essence et pharmacies de garde au Bénin, de la plus proche à la plus éloignée.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_BJ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tracker Bénin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Tracker Bénin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Écran d'attente pendant le chargement de l'application. */
    html, body { height: 100%; margin: 0; background: #F5F7F4; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #14231C;
    }
    #loading .logo {
      width: 64px; height: 64px; border-radius: 20px; background: #008751;
    }
    #loading .name { font-size: 20px; font-weight: 800; }
    #loading .bar {
      width: 140px; height: 4px; border-radius: 4px; background: #E4E9E5;
      overflow: hidden;
    }
    #loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #008751; border-radius: 4px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { margin-left: -40%; } to { margin-left: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      #loading .bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="Chargement de Tracker Bénin">
    <div class="logo"></div>
    <div class="name">Tracker Bénin</div>
    <div class="bar"></div>
  </div>
  <script>
    // Retire l'écran d'attente dès que Flutter affiche sa première image.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
